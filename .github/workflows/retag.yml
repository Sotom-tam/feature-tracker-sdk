name: Retag v1.0.1

on:
  push:
    branches: [main]

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Delete and recreate tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -d v1.0.1 || true
          git push origin :refs/tags/v1.0.1 || true
          git tag v1.0.1
          git push origin v1.0.1

      - name: Purge jsDelivr cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/Sotom-tam/feature-tracker-sdk@v1.0.1/featureTracker.js"
